name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish a GitHub Release on tags

jobs:
  build:
    # Same image Microsoft's Windows-driver-samples CI uses with the WDK NuGet packages.
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore WDK / SDK NuGet packages
        run: nuget restore .\packages.config -PackagesDirectory .\packages\

      - name: Build driver (UMDF2)
        run: >
          msbuild driver\VirtualPtp.vcxproj -nologo -m -v:m
          -p:Configuration=Release -p:Platform=x64 -p:SignMode=Off
          -binaryLogger:LogFile=driver-build.binlog

      - name: Build tray app and setup tool
        shell: cmd
        run: |
          mkdir out
          cd out
          cl /nologo /O2 /EHsc /std:c++17 /W4 /DUNICODE /D_UNICODE ..\app\MiddlePtp.cpp /link /SUBSYSTEM:WINDOWS user32.lib shell32.lib hid.lib setupapi.lib winmm.lib || exit /b 1
          cl /nologo /O2 /EHsc /std:c++17 /W4 /DUNICODE /D_UNICODE ..\tools\vptp-setup.cpp /link setupapi.lib newdev.lib || exit /b 1

      - name: Assemble release folder (driver package + unsigned catalog)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inf = Get-ChildItem driver -Recurse -Filter VirtualPtp.inf -File |
                 Where-Object { Test-Path (Join-Path $_.DirectoryName 'VirtualPtp.dll') } |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $inf) { throw 'Built driver package (VirtualPtp.inf + VirtualPtp.dll) not found' }
          Write-Host "Driver package: $($inf.DirectoryName)"

          $dist = 'dist\VirtualPtp'
          New-Item -ItemType Directory -Force "$dist\driver" | Out-Null
          Copy-Item (Join-Path $inf.DirectoryName 'VirtualPtp.inf'), (Join-Path $inf.DirectoryName 'VirtualPtp.dll') "$dist\driver"
          if (Select-String -Path "$dist\driver\VirtualPtp.inf" -Pattern '\$UMDFVERSION\$|\$ARCH\$' -Quiet) { throw 'INF was not stamped' }

          # Catalog of file hashes. It is signed later, on the user's PC, with their own certificate
          # (Authenticode-signing the DLL afterwards doesn't change its catalog hash).
          $inf2cat = Get-ChildItem packages, "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter Inf2Cat.exe -File -ErrorAction SilentlyContinue |
                     Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $inf2cat) { throw 'Inf2Cat.exe not found' }
          & $inf2cat.FullName "/driver:$((Resolve-Path "$dist\driver").Path)" /os:10_CO_X64,10_NI_X64,10_GE_X64
          if ($LASTEXITCODE -ne 0) { throw "Inf2Cat failed ($LASTEXITCODE)" }

          Copy-Item out\MiddlePtp.exe, out\vptp-setup.exe $dist
          Copy-Item scripts\install.ps1, scripts\uninstall.ps1, README.md $dist
          Get-ChildItem $dist -Recurse | Format-Table FullName, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualPtp-x64
          path: dist

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: '*.binlog'

      - name: Publish GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist\VirtualPtp -DestinationPath VirtualPtp-x64.zip
          gh release create "${{ github.ref_name }}" VirtualPtp-x64.zip --title "${{ github.ref_name }}" --generate-notes
